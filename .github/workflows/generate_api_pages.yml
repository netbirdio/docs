name: generate api pages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Netbird release tag version'
        required: true
        default: "refs/tags/vX.Y.Z"
        type: string

permissions:
  contents: read

jobs:
  # netbird dispatches this for every tag it pushes: release candidates,
  # canary builds of unmerged pull requests, and patches on an older release
  # line. The public API reference should describe the newest release only,
  # so anything else stops here, before the macOS job. Checked against
  # netbird's tags rather than the order of dispatches, it also covers a
  # dispatch made by hand.
  release:
    runs-on: ubuntu-latest
    outputs:
      generate: ${{ steps.newest.outputs.generate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/newest-netbird-release.sh
          sparse-checkout-cone-mode: false

      # An assignment, so a broken tag list (exit 1) fails the job.
      - name: Generate only for the newest stable release
        id: newest
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          generate=$(scripts/newest-netbird-release.sh "$TAG")
          echo "generate=${generate}" >> "$GITHUB_OUTPUT"

  generate_api_pages:
    needs: release
    if: needs.release.outputs.generate == 'true'
    # One generation at a time: overlapping ones regenerate the same files and
    # would collide. On this job rather than the workflow, so only dispatches
    # that passed the release job queue here: a canary or older-tag dispatch
    # can no longer replace a pending release's run and then skip generation
    # itself. A pending generation replaced by a newer one is fine, since each
    # regenerates the whole directory.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    runs-on: macos-latest
    steps:
      - name: Parse tag input
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{ github.event.inputs.tag }}
          version_extractor_regex: '\/v(.*)$'

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEV_GITHUB_TOKEN }}

      # A run queued behind another (see the job's concurrency) checks out the
      # commit pinned at its dispatch time, not the branch's current tip.
      # Sync before generating so the diff is computed against reality —
      # otherwise the pre-push rebase replays a stale-base snapshot, and a
      # file the newer spec removed could silently survive from the prior run.
      - name: Sync to branch tip
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Create directory
        run: mkdir -p generator/openapi

      - name: Download openapi.yml
        run: curl -L -o generator/openapi/openapi.yml "https://raw.githubusercontent.com/netbirdio/netbird/v${{ steps.semver_parser.outputs.fullversion }}/shared/management/http/api/openapi.yml"

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build Go project
        run: (cd ./generator && go build -o expandOpenAPIRef)

      - name: Expand openapi.yml
        run: (cd ./generator && ./expandOpenAPIRef)

      - name: Remove old generated files
        run: rm -rf src/pages/ipa/resources/*

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci: this workflow never changes dependencies, so install exactly
      # the committed lockfile and never mutate it (macos-latest's npm can
      # differ from the one that generated package-lock.json).
      - name: Install dependencies
        run: npm ci

      - name: Generate api pages for netbird main openapi definition
        run: npx ts-node generator/index.ts gen --input generator/openapi/expanded.yml --output src/pages/ipa/resources

      - name: Check git diff and untracked files
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain src/pages/ipa/resources)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Asked again just before pushing: a newer release tagged while this run
      # generated must not be overwritten by it. Versions rather than the order
      # of dispatches, so a later canary or older-tag dispatch, which never
      # generates, can't hold this one back. An assignment, so a broken tag
      # list fails the step instead of pushing.
      - name: Check this is still the newest release
        id: freshness
        if: steps.git_diff.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          newest=$(scripts/newest-netbird-release.sh "$TAG")
          echo "push=${newest}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.git_diff.outputs.changed == 'true' && steps.freshness.outputs.push == 'true'
        run: |
          git config --global user.email "dev@netbird.io"
          git config --global user.name "netbirddev"

          # Stage only the regenerated API pages — never sweep up incidental
          # changes like a rewritten package-lock.json.
          git add src/pages/ipa/resources
          git commit -m "Update API pages with v${{ steps.semver_parser.outputs.fullversion }}"
          # The run takes minutes; if the branch moved meanwhile, replay our
          # single generated-files commit on top instead of failing the push.
          # A conflict is only possible against a concurrent edit of the
          # generated files themselves and fails the run loudly.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
